<style>





/* =====================================================
   إعدادات عامة
===================================================== */

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:#f4f0ff;
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  margin:0;
  font-family:"Tajawal",sans-serif;
  color:#3b0764;
  background:#f4f0ff;
}

button,
input,
a{
  font-family:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

img{
  display:block;
  max-width:100%;
}

#root{
  min-height:100vh;
}

@font-face{
  font-family:"AA Galaxy";
  src:url("https://raw.githubusercontent.com/zamnnzz/fonts/main/hroffont-B6Zk_0ya.woff2") format("woff2");
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}

.cairo-btn{
  font-family:"Cairo",sans-serif !important;
}


/* =====================================================
   خلفية الصفحة الرئيسية بدون مربعات
===================================================== */

.home-game-background{
  position:relative;
  isolation:isolate;
  min-height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 12% 18%,
      rgba(168,85,247,.12),
      transparent 25%
    ),
    radial-gradient(
      circle at 88% 72%,
      rgba(124,58,237,.10),
      transparent 28%
    ),
    #f4f0ff;
}

/* إلغاء جميع المربعات والخطوط المتحركة */
.home-game-background::before,
.home-game-background::after{
  content:none !important;
  display:none !important;
}

/* =====================================================
   الشريط العلوي
===================================================== */

.top-offer{
  position:relative;
  width:100%;
  z-index:9999;
  overflow:hidden;
  padding:7px 0;

  color:#fff;
  background:linear-gradient(90deg,#6d28d9,#8b5cf6);

  border-bottom:3px solid #4c1d95;

  box-shadow:
    0 5px 0 rgba(76,29,149,.22),
    0 10px 20px rgba(76,29,149,.12);
}

.offer-track{
  display:flex;
  width:max-content;
  animation:offerMove 18s linear infinite;
}

.offer-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding-inline:32px;
  white-space:nowrap;
  font-size:14px;
  font-weight:900;
}

.offer-btn{
  padding:6px 13px;
  border:2px solid rgba(255,255,255,.7);
  border-radius:10px;

  color:#6d28d9;
  background:#fff;

  font-size:12px;
  font-weight:900;
  text-decoration:none;

  box-shadow:3px 3px 0 #4c1d95;
}

@keyframes offerMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(50%);
  }
}


/* =====================================================
   شبكة الألعاب
===================================================== */

.games-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  justify-content:center;
  gap:12px;
  width:100%;
}


/* =====================================================
   بطاقة اللعبة الكرتونية
===================================================== */

.game-card{
  position:relative;
  width:100%;
  height:300px;
  margin:auto;
  overflow:hidden;

  display:flex;
  flex-direction:column;

  color:inherit;
  text-decoration:none;

  background:#fff;

  border:3px solid #e5e0ea;
  border-radius:18px;

  box-shadow:
    6px 6px 0 #d2cbd8,
    12px 12px 25px rgba(59,7,100,.10);

  cursor:pointer;

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

/* لمعة كرتونية */
.game-card::before{
  content:"";
  position:absolute;
  top:-130%;
  left:-70%;
  z-index:5;

  width:55%;
  height:330%;

  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(255,255,255,.45),
      transparent
    );

  transform:rotate(24deg);
  transition:left .75s ease;
}

.game-card:hover::before{
  left:135%;
}

/* إطار داخلي */
.game-card::after{
  content:"";
  position:absolute;
  inset:7px;
  z-index:4;
  pointer-events:none;

  border:1px dashed rgba(124,58,237,.16);
  border-radius:12px;
}

.game-card:hover{
  transform:translateY(-7px) rotate(-.3deg);
  border-color:#c4b5fd;

  box-shadow:
    8px 8px 0 #b8afd0,
    17px 17px 32px rgba(76,29,149,.16);
}


/* =====================================================
   صورة اللعبة
===================================================== */



.game-image-box{
  position:relative;
  height:145px;
  overflow:hidden;
  flex-shrink:0;

  background:#ede9fe;
  border-bottom:3px solid #e4dff0;
}

.game-image-box::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      transparent 60%,
      rgba(59,7,100,.12)
    );
}

.game-image{
  width:100%;
  height:100%;
  object-fit:cover;

  transition:
    transform .4s ease,
    filter .4s ease;
}

.game-card:hover .game-image{
  transform:scale(1.055);
  filter:saturate(1.08) contrast(1.02);
}
/* =====================================================
   تقييم اللعبة
===================================================== */

.game-rating{
  position:absolute;
  top:9px;
  right:9px;
  z-index:10;

  padding:5px 10px;

  color:#4c1d95;
  background:#fff;

  border:2px solid #ddd6fe;
  border-radius:9px;

  font-size:12px;
  font-weight:900;

  box-shadow:3px 3px 0 #c4b5fd;
}


/* =====================================================
   محتوى بطاقة اللعبة
===================================================== */

.game-content{
  position:relative;
  z-index:6;

  display:flex;
  flex:1;
  flex-direction:column;

  padding:12px;
}

.game-title{
  margin:0 0 8px;

  color:#3b0764;

  font-size:17px;
  line-height:1.3;
  font-weight:900;
  letter-spacing:-.2px;
}

.game-desc{
  height:42px;
  margin:0 0 10px;
  overflow:hidden;

  color:#746c7d;

  font-size:13px;
  line-height:1.5;
}


/* =====================================================
   وسوم الألعاب
===================================================== */

.game-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;

  margin-top:auto;
  margin-bottom:10px;
}

.game-tag{
  padding:5px 8px;

  color:#554a63;
  background:#f4f1f7;

  border:2px solid #e2dce8;
  border-radius:7px;

  font-size:11px;
  font-weight:900;

  box-shadow:2px 2px 0 #d5cedb;
}


/* =====================================================
   زر عرض اللعبة
===================================================== */

.game-btn{
  width:100%;
  height:40px;
  margin-top:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  background:linear-gradient(90deg,#6d28d9,#8b5cf6);

  border:2px solid #4c1d95;
  border-radius:9px;

  font-size:14px;
  font-weight:900;

  box-shadow:
    4px 4px 0 #4c1d95,
    0 8px 16px rgba(109,40,217,.18);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.game-btn:hover{
  filter:brightness(1.07);
  transform:translateY(-1px);

  box-shadow:
    5px 5px 0 #4c1d95,
    0 10px 20px rgba(109,40,217,.22);
}

.game-btn:active{
  transform:translate(3px,3px);

  box-shadow:
    1px 1px 0 #4c1d95,
    0 5px 10px rgba(109,40,217,.16);
}


/* =====================================================
   الأسئلة الشائعة
===================================================== */

.faq-section{
  width:100%;
  max-width:950px;
  margin:35px auto 70px;
  padding:0 16px;
}

.faq-heading-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:28px;
}

.faq-heading{
  position:relative;
  margin:0;
  padding:14px 46px;

  color:#fff;
  background:linear-gradient(135deg,#3b0764,#7c3aed);

  border:3px solid #4c1d95;
  border-radius:15px;

  font-size:28px;
  font-weight:900;
  text-align:center;

  box-shadow:
    6px 6px 0 #4c1d95,
    0 12px 24px rgba(76,29,149,.18);
}

.faq-heading::after{
  content:"";
  position:absolute;
  right:12px;
  bottom:8px;

  width:9px;
  height:9px;

  background:#facc15;

  box-shadow:
    -17px 0 0 rgba(255,255,255,.45);
}

.faq-list{
  display:flex;
  flex-direction:column;
  gap:17px;
}

.faq-item{
  overflow:hidden;

  background:#fff;

  border:3px solid #e5e0e8;
  border-radius:17px;

  box-shadow:
    5px 5px 0 #d3ccd8,
    11px 11px 24px rgba(0,0,0,.07);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}

.faq-item:hover{
  transform:translateY(-3px);
  border-color:#cfc4dc;

  box-shadow:
    7px 7px 0 #c5bccd,
    15px 15px 28px rgba(0,0,0,.10);
}

.faq-question{
  width:100%;
  min-height:82px;
  padding:17px 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;

  color:inherit;
  background:#fff;

  border:0;
  outline:0;

  cursor:pointer;
  text-align:right;
}

.faq-question-text{
  flex:1;

  color:#3b2e47;

  font-size:19px;
  line-height:1.7;
  font-weight:900;
}

.faq-icon{
  position:relative;

  width:48px;
  height:48px;
  min-width:48px;
  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#62566e;
  background:#f0ecf3;

  border:2px solid #dcd4e2;
  border-radius:9px;

  box-shadow:3px 3px 0 #d2cad8;

  transition:
    transform .25s ease,
    color .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.faq-icon::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;

  width:10px;
  height:10px;

  border-top:3px solid currentColor;
  border-left:3px solid currentColor;

  transform:translate(-50%,-65%) rotate(225deg);
}

.faq-icon.open{
  color:#fff;
  background:#7c3aed;

  border-color:#4c1d95;

  box-shadow:3px 3px 0 #4c1d95;
}

.faq-icon.open::before{
  transform:translate(-50%,-30%) rotate(45deg);
}

.faq-answer{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;

  background:#fcfaff;

  border-top:0 solid transparent;

  transition:
    grid-template-rows .28s ease,
    opacity .22s ease,
    border-color .22s ease;
}

.faq-answer.open{
  grid-template-rows:1fr;
  opacity:1;

  border-top:2px dashed #e2dbe8;
}

.faq-answer-inner{
  overflow:hidden;
}

.faq-answer-text{
  margin:0;
  padding:20px 24px 24px;

  color:#706778;

  font-size:17px;
  line-height:2;
  font-weight:700;
}

.faq-more-wrap{
  display:flex;
  justify-content:center;
  margin-top:27px;
}

.faq-more-btn{
  padding:13px 30px;

  color:#4c1d95;
  background:#fff;

  border:3px solid #d8cfe0;
  border-radius:11px;

  font-size:16px;
  font-weight:900;
  cursor:pointer;

  box-shadow:4px 4px 0 #c8bfd0;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.faq-more-btn:hover{
  background:#f6f2fa;
  transform:translateY(-2px);

  box-shadow:6px 6px 0 #bfb4c8;
}

.faq-more-btn:active{
  transform:translate(3px,3px);
  box-shadow:1px 1px 0 #bfb4c8;
}


/* =====================================================
   الباقات والمميزات
===================================================== */

.feature-card,
.package-card{
  position:relative;

  border:3px solid #e6e0e9 !important;
  border-radius:20px !important;

  box-shadow:
    6px 6px 0 #d1c9d7,
    13px 13px 28px rgba(0,0,0,.08) !important;

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.feature-card::after,
.package-card::after{
  content:"";
  position:absolute;
  top:10px;
  left:10px;

  width:8px;
  height:8px;

  background:#c4b5fd;

  box-shadow:
    14px 0 0 #e9d5ff;
}

.feature-card:hover,
.package-card:hover{
  transform:translateY(-5px) rotate(-.2deg);

  box-shadow:
    8px 8px 0 #c0b6c8,
    18px 18px 34px rgba(0,0,0,.11) !important;
}


/* =====================================================
   ظهور العناصر عند النزول
===================================================== */

/*
   أبقينا العناصر ظاهرة افتراضيًا.
   هذا يمنع مشكلة ظهور البطاقات ثم اختفائها.
*/

.reveal-on-scroll{
  opacity:1;
  transform:none;
  filter:none;
}

.reveal-on-scroll.is-visible{
  opacity:1;
  transform:none;
  filter:none;
}

.reveal-delay-1,
.reveal-delay-2,
.reveal-delay-3,
.reveal-delay-4{
  transition-delay:0s;
}

/* =====================================================
   الكمبيوتر
===================================================== */

  .games-grid{
    grid-template-columns:repeat(auto-fit,minmax(245px,300px));
    justify-content:center;
    gap:25px;
  }

  .game-card{
    width:100%;
    max-width:300px;
    height:345px;
  }

  .game-image-box{
    height:175px;
  }

  .game-title{
    font-size:21px;
  }

  .game-desc{
    height:48px;

  }

  }
}


/* =====================================================
   الجوال
============/* =====================================================
   الجوال
===================================================== */
@media (max-width:559px){

  .games-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .game-card{
    width:100%;
    height:345px;
    border-radius:18px;
  }

  .game-image-box{

  }

  .game-content{

  }

    min-height:70px;

    gap:11px;
  }

  }

  }

/* الشاشات الصغيرة جدًا */

  .games-grid{
    gap:8px;
  }

  .game-card{
    height:280px;
  }

  .game-image-box{
    height:125px;
  }

  .game-content{
    padding:8px;
  }

  .game-title{
    font-size:12px;
  }

  .game-tag{
    padding:3px 5px;
    font-size:8px;
  }

  .game-btn{
    height:35px;
    font-size:11px;
  }
}

/* =====================================================
   التركيز والوصول
===================================================== */

button:focus-visible,
a:focus-visible,
input:focus-visible{
  outline:3px solid rgba(124,58,237,.32);
  outline-offset:3px;
}


/* =====================================================
   تقليل الحركة
===================================================== */

@media (prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto !important;
    animation:none !important;
    transition:none !important;
  }

  .game-card:hover,
  .feature-card:hover,
  .package-card:hover,
  .faq-item:hover{
    transform:none;
  }
}



































/* =====================================================
   نافذة دخول اللعبة الكرتونية
===================================================== */

.game-login-overlay{
  position:fixed;
  inset:0;
  z-index:5000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:16px;

  background:rgba(31,18,45,.82);
  backdrop-filter:blur(7px);
}

.game-login-card{
  position:relative;
  width:100%;
  max-width:430px;
  overflow:hidden;

  background:#fff;

  border:3px solid #ddd6e3;
  border-radius:18px;

  box-shadow:
    9px 9px 0 #bdb3c6,
    0 28px 70px rgba(31,18,45,.42);

  animation:gameLoginPop .28s ease;
}

@keyframes gameLoginPop{
  from{
    opacity:0;
    transform:translateY(18px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.game-login-pixels span{
  position:absolute;
  z-index:20;

  width:12px;
  height:12px;

  image-rendering:pixelated;
}

.game-login-pixels span:nth-child(1){
  top:12px;
  left:12px;
  background:#fde047;
}

.game-login-pixels span:nth-child(2){
  top:12px;
  left:31px;
  background:rgba(255,255,255,.5);
}

.game-login-pixels span:nth-child(3){
  right:12px;
  bottom:12px;
  background:#c4b5fd;
}

.game-login-header{
  position:relative;
  overflow:hidden;

  padding:32px 24px;

  color:#fff;
  text-align:center;

  background:
    linear-gradient(
      135deg,
      #3b0764,
      #6d28d9 55%,
      #8b5cf6
    );

  border-bottom:3px solid #4c1d95;
}

.game-login-grid{
  position:absolute;
  inset:0;
  pointer-events:none;

  opacity:.18;

  background-image:
    linear-gradient(
      rgba(255,255,255,.35) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.35) 1px,
      transparent 1px
    );

  background-size:18px 18px;
}

.game-login-header::after{
  content:"";
  position:absolute;

/* =========================================
   صفحة تفاصيل اللعبة بعد الضغط على عرض اللعبة
========================================= */

.game-details-page{
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
}

/* هيدر صفحة اللعبة */
.game-details-hero{
  background:
    linear-gradient(
      rgba(255,255,255,.07) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.07) 1px,
      transparent 1px
    ),
    linear-gradient(
      135deg,
      #3b0764,
      #6d28d9 55%,
      #8b5cf6
    );

  background-size:
    24px 24px,
    24px 24px,
    auto;

  border-bottom:4px solid #4c1d95;
  border-radius:0 0 38px 38px;

  box-shadow:
    0 7px 0 #4c1d95,
    0 20px 38px rgba(76,29,149,.22);
}

.game-details-hero::before,
.game-details-hero::after{
  content:"";
  position:absolute;
  pointer-events:none;
  image-rendering:pixelated;
}

.game-details-hero::before{
  width:16px;
  height:16px;
  top:28%;
  left:7%;

  background:#fde047;

  box-shadow:
    35px 45px 0 rgba(255,255,255,.28),
    125px -30px 0 rgba(255,255,255,.18),
    240px 60px 0 rgba(253,224,71,.45),
    410px -20px 0 rgba(255,255,255,.15);
}

.game-details-hero::after{
  width:12px;
  height:12px;
  right:7%;
  bottom:22%;

  background:#c4b5fd;

  box-shadow:
    -42px -52px 0 rgba(255,255,255,.22),
    -150px 24px 0 rgba(253,224,71,.4),
    -280px -40px 0 rgba(255,255,255,.15);
}

/* المربعات داخل الهيدر */
.game-details-hero .bg-white\/15{
  border:2px solid rgba(255,255,255,.28) !important;
  border-radius:14px !important;

  background:rgba(255,255,255,.14) !important;

  box-shadow:
    4px 4px 0 rgba(37,13,64,.36);

  backdrop-filter:blur(8px);

  transition:
    transform .22s ease,
    background .22s ease,
    box-shadow .22s ease;
}

.game-details-hero .bg-white\/15:hover{
  transform:translateY(-3px);

  background:rgba(255,255,255,.2) !important;

  box-shadow:
    6px 6px 0 rgba(37,13,64,.42);
}

/* زر الرجوع */
.game-details-hero > button,
.game-details-hero .cairo-btn{
  border:2px solid rgba(255,255,255,.28);

  box-shadow:
    4px 4px 0 rgba(37,13,64,.42);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.game-details-hero > button:hover,
.game-details-hero .cairo-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    6px 6px 0 rgba(37,13,64,.5);
}

/* بطاقة أزرار اللعب */
.game-details-action-card{
  position:relative;
  overflow:hidden;

  padding:24px;

  background:
    linear-gradient(
      rgba(124,58,237,.04) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(124,58,237,.04) 1px,
      transparent 1px
    ),
    #fff;

  background-size:22px 22px;

  border:3px solid #ded6e8;
  border-radius:24px;

  box-shadow:
    7px 7px 0 #c8bfd1,
    0 20px 40px rgba(51,40,63,.1);
}

.game-details-action-card::before{
  content:"";
  position:absolute;
  top:13px;
  left:13px;

  width:11px;
  height:11px;

  background:#fde047;

  box-shadow:
    20px 0 0 #c4b5fd;
}

/* أزرار صفحة اللعبة */
.game-details-btn{
  width:100%;
  min-height:62px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:14px 18px;

  border-radius:13px;
  border:3px solid transparent;

  font-size:20px;
  font-weight:900;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.game-details-btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.04);
}

.game-details-btn:active{
  transform:translate(3px,3px);
  box-shadow:none;
}

.game-details-play{
  color:#fff;

  background:
    linear-gradient(90deg,#6d28d9,#8b5cf6);

  border-color:#4c1d95;

  box-shadow:
    5px 5px 0 #4c1d95,
    0 12px 24px rgba(109,40,217,.2);
}

.game-details-buy{
  color:#fff;

  background:
    linear-gradient(90deg,#10b981,#22c55e);

  border-color:#15803d;

  box-shadow:
    5px 5px 0 #15803d,
    0 12px 24px rgba(34,197,94,.18);
}

  border-color:#7c3aed;

}

/* الأقسام البيضاء داخل صفحة اللعبة */
.game-details-page section.bg-white,
.game-details-page div.bg-white.border{
  border-width:2px !important;
  border-color:#e2dbe8 !important;

  box-shadow:
    5px 5px 0 #d4cdd9,

}

/* صور من داخل اللعبة */

  border:3px solid #ded6e5 !important;

    5px 5px 0 #cfc6d5 !important;

  transform:translateY(-3px);

  box-shadow:
    7px 7px 0 #c2b7ca !important;
}

/* الألعاب الأخرى */
.game-details-page section.mt-12 a img{
  border:3px solid #ded6e5;

  border-radius:18px;

  box-shadow:
    5px 5px 0 #cfc6d5,
    0 12px 24px rgba(51,40,63,.08);

  transition:
    transform .22s ease,
    box-shadow .22s ease;
}

.game-details-page section.mt-12 a:hover img{
  transform:translateY(-4px) scale(1.02);

  box-shadow:
    7px 7px 0 #c2b7ca,
    0 17px 28px rgba(51,40,63,.11);

/* الجوال */
@media (max-width:560px){

  .game-details-hero{
    border-radius:0 0 28px 28px;

    box-shadow:
      0 5px 0 #4c1d95,
      0 15px 28px rgba(76,29,149,.2);
  }

    padding:17px;

  }

    opacity:.55;
  }
}

/* ==========================================
   الباقات - ستايل جديد مثل بطاقات الألعاب
========================================== */

.packages-section{
    padding:70px 16px;
}

.packages-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:28px;
    max-width:1100px;
    margin:auto;
}

.package-card{
    position:relative;
    overflow:hidden;

    background:#fff;
    border:3px solid #e5e0ea !important;
    border-radius:20px !important;

    box-shadow:
        6px 6px 0 #d2cbd8,
        12px 12px 25px rgba(59,7,100,.10) !important;

    transition:.25s;
}

.package-card:hover{
    transform:translateY(-7px);

    box-shadow:
        8px 8px 0 #c7bfd2,
        18px 18px 32px rgba(59,7,100,.16) !important;
}

.package-card::before{
    content:"";
    position:absolute;
    top:-120%;
    left:-60%;

    width:55%;
    height:320%;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:rotate(24deg);
    transition:.8s;
}

.package-card:hover::before{
    left:130%;
}

.package-card::after{
    content:"";
    position:absolute;
    inset:8px;

    border:1px dashed rgba(124,58,237,.18);
    border-radius:14px;

    pointer-events:none;
}

.package-card h3{
    font-size:28px;
    font-weight:900;
    color:#3b0764;
}

.package-card .price{
    font-size:42px;
    font-weight:900;
    color:#6d28d9;
}

.package-card ul{
    margin:22px 0;
    padding:0;
    list-style:none;
}

.package-card li{
    padding:10px 0;
    font-size:15px;
    font-weight:700;
    color:#555;
    border-bottom:1px dashed #e8e3ef;
}

.package-card button,
.package-card a{
    display:flex;
    justify-content:center;
    align-items:center;

    width:100%;
    height:48px;

    border:none;
    border-radius:10px;

    background:linear-gradient(90deg,#6d28d9,#8b5cf6);
    color:#fff;

    font-size:16px;
    font-weight:900;

    box-shadow:
        4px 4px 0 #4c1d95;

    transition:.2s;
}

.package-card button:hover,
.package-card a:hover{
    transform:translateY(-2px);
}

.package-card button:active,
.package-card a:active{
    transform:translate(3px,3px);
    box-shadow:1px 1px 0 #4c1d95;
}

/* الباقة المميزة */

.package-card.featured{
    border-color:#facc15 !important;
}

.package-card.featured::after{
    border-color:#facc15;
}

.package-card.featured .price{
    color:#ca8a04;
}
