<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جرس اللعبة</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;
  background:radial-gradient(circle,rgba(226,188,85,.15) 2px,transparent 2.4px) 0 0/20px 20px,#fff8dc;
  display:flex;align-items:center;justify-content:center;padding:18px;color:#111;
}
.card{
  width:min(94%,460px);border:3px solid #111;border-radius:24px;background:#fff8d8;
  box-shadow:0 8px 0 #111;padding:22px;text-align:center;
}
h1{margin:0 0 18px}
label{display:block;text-align:right;font-weight:900;margin:12px 0 7px}
input,select{
  width:100%;min-height:54px;border:3px solid #111;border-radius:13px;
  padding:0 14px;font-size:17px;font-weight:800;background:#fff;
}
.join{
  width:100%;min-height:58px;margin-top:18px;border:3px solid #111;border-radius:14px;
  background:#79cff4;font-size:20px;font-weight:900;box-shadow:0 5px 0 #111;cursor:pointer;
}
.error{min-height:24px;margin-top:10px;color:#b42318;font-weight:900}
#gameArea{display:none}
.countdown{font-size:64px;font-weight:900;margin:18px 0}
.buzzer{
  width:220px;height:220px;border-radius:50%;border:8px solid #111;background:#ef3f3f;
  color:#fff;font-size:42px;font-weight:900;box-shadow:0 14px 0 #8c1919;
  cursor:pointer;transition:.15s;
}
.buzzer:disabled{opacity:.48;cursor:not-allowed}
.buzzer:active:not(:disabled){transform:translateY(8px);box-shadow:0 6px 0 #8c1919}
.status{margin-top:22px;font-size:20px;font-weight:900}
.team-badge{display:inline-block;margin-top:8px;padding:8px 14px;border:3px solid #111;border-radius:999px;background:#fff}

/* v75 — Player responsive */
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100svh !important;
  padding:
    calc(14px + var(--safe-top))
    max(14px,var(--safe-right))
    calc(18px + var(--safe-bottom))
    max(14px,var(--safe-left)) !important;
}

.card{
  width:min(100%,460px) !important;
  max-height:calc(100svh - 32px - var(--safe-top) - var(--safe-bottom));
  overflow:auto;
}

input,select,.join{
  font-size:16px !important;
}

.buzzer{
  width:min(58vw,220px) !important;
  height:min(58vw,220px) !important;
  font-size:clamp(28px,9vw,42px) !important;
}

@media(max-width:420px){
  body{
    align-items:flex-start !important;
  }

  .card{
    margin-top:8px;
    padding:17px !important;
    border-radius:19px !important;
    box-shadow:0 6px 0 #111 !important;
  }

  h1{
    font-size:25px !important;
  }

  input,select{
    min-height:49px !important;
  }

  .join{
    min-height:53px !important;
    font-size:18px !important;
  }

  .countdown{
    font-size:52px !important;
    margin:12px 0 !important;
  }

  .status{
    margin-top:16px !important;
    font-size:17px !important;
  }
}

@media(max-height:540px) and (orientation:landscape){
  body{
    align-items:flex-start !important;
  }

  .card{
    width:min(96%,620px) !important;
    padding:14px !important;
  }

  #gameArea{
    display:grid;
    grid-template-columns:1fr auto;
    gap:14px;
    align-items:center;
  }

  #gameArea h1,
  #teamBadge,
  #countdown,
  #status{
    grid-column:1;
  }

  .buzzer{
    grid-column:2;
    grid-row:1/5;
    width:160px !important;
    height:160px !important;
  }
}

</style>
</head>
<body>
<div class="card">
  <div id="joinArea">
    <h1>الدخول إلى الجرس 🔔</h1>

    <label for="playerName">اسمك</label>
    <input id="playerName" maxlength="24" placeholder="اكتب اسمك" autocomplete="name">

    <label for="teamSelect">اختر الفريق</label>
    <select id="teamSelect">
      <option value="">اختر الفريق</option>
      <option value="one" id="teamOneOption">الفريق الأول</option>
      <option value="two" id="teamTwoOption">الفريق الثاني</option>
    </select>

    <button class="join" onclick="joinGame()">دخول</button>
    <div id="joinError" class="error"></div>
  </div>

  <div id="gameArea">
    <h1 id="welcomeText"></h1>
    <div id="teamBadge" class="team-badge"></div>
    <div id="countdown" class="countdown" style="display:none"></div>
    <button id="buzzerBtn" class="buzzer" onclick="pressBuzzer()">جرس</button>
    <div id="status" class="status">استعد...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getDatabase, ref, get, onValue, runTransaction, goOnline, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {"apiKey": "AIzaSyACS3IRZjIEkBk38y5C3uXOTa8N2ju8jwA", "authDomain": "picture-game-8946e.firebaseapp.com", "databaseURL": "https://picture-game-8946e-default-rtdb.europe-west1.firebasedatabase.app", "projectId": "picture-game-8946e", "storageBucket": "picture-game-8946e.firebasestorage.app", "messagingSenderId": "246477951240", "appId": "1:246477951240:web:e0e2666fddb83f4ada5cbd", "measurementId": "G-00NCKBL9Q8"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const params = new URLSearchParams(location.hash.replace(/^#/, ""));
const sessionId = params.get("session");

if(!sessionId){
  document.body.innerHTML = '<div style="font-family:Tahoma;padding:30px;text-align:center">رابط الجلسة غير صالح</div>';
  throw new Error("Missing session");
}

await signInAnonymously(auth);

const sessionRef = ref(db, "sessions/" + sessionId);
const snapshot = await get(sessionRef);

if(!snapshot.exists()){
  document.body.innerHTML = '<div style="font-family:Tahoma;padding:30px;text-align:center">الجلسة غير موجودة</div>';
  throw new Error("Session not found");
}

const session = snapshot.val();
document.getElementById("teamOneOption").textContent = session.teams?.one?.name || "الفريق الأول";
document.getElementById("teamTwoOption").textContent = session.teams?.two?.name || "الفريق الثاني";


async function reconnectPlayer(){
  try{
    goOnline(db);

    if(!auth.currentUser){
      await signInAnonymously(auth);
    }

    await get(sessionRef);
  }catch(error){}
}

window.addEventListener("online", reconnectPlayer);
window.addEventListener("focus", reconnectPlayer);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    reconnectPlayer();
  }
});
setInterval(reconnectPlayer, 15000);

let playerName = "";
let teamKey = "";
let teamName = "";
let reopenTimer = null;
let buzzerEnabled = false;
let lastWinnerKey = "";
let roomBuzzerEnabled = session.state?.buzzerEnabled !== false;
let buzzerLockSeconds = Math.min(
  10,
  Math.max(1, Number(session.state?.buzzerLockSeconds) || 3)
);

window.joinGame = function(){
  playerName = document.getElementById("playerName").value.trim();
  teamKey = document.getElementById("teamSelect").value;
  const error = document.getElementById("joinError");

  if(!playerName){
    error.textContent = "الاسم إجباري";
    return;
  }

  if(!teamKey){
    error.textContent = "اختيار الفريق إجباري";
    return;
  }

  teamName = teamKey === "one"
    ? (session.teams?.one?.name || "الفريق الأول")
    : (session.teams?.two?.name || "الفريق الثاني");

  error.textContent = "";
  document.getElementById("joinArea").style.display = "none";
  document.getElementById("gameArea").style.display = "block";
  document.getElementById("welcomeText").textContent = "أهلًا " + playerName;
  document.getElementById("teamBadge").textContent = teamName;

  openBuzzerNow();
};

function openBuzzerNow(){
  clearInterval(reopenTimer);

  if(!roomBuzzerEnabled){
    buzzerEnabled = false;
    document.getElementById("buzzerBtn").disabled = true;
    document.getElementById("status").textContent = "الجرس مغلق من الإعدادات";
    document.getElementById("countdown").style.display = "none";
    return;
  }

  buzzerEnabled = true;

  const countdown = document.getElementById("countdown");
  const status = document.getElementById("status");
  const button = document.getElementById("buzzerBtn");

  countdown.style.display = "none";
  countdown.textContent = "";
  button.disabled = false;
  status.textContent = "الجرس مفتوح الآن!";
}

function showThreeSecondLock(buzzer){
  clearInterval(reopenTimer);

  buzzerEnabled = false;

  const countdown = document.getElementById("countdown");
  const status = document.getElementById("status");
  const button = document.getElementById("buzzerBtn");

  button.disabled = true;
  countdown.style.display = "block";

  const winnerKey =
    String(buzzer.pressedAt || "") + "-" +
    String(buzzer.playerName || "") + "-" +
    String(buzzer.teamKey || "");

  if(winnerKey !== lastWinnerKey){
    lastWinnerKey = winnerKey;
  }

  const updateTimer = () => {
    const remainingMs = Math.max(0, Number(buzzer.lockedUntil || 0) - Date.now());
    const remainingSeconds = Math.ceil(remainingMs / 1000);

    countdown.textContent = remainingSeconds;

    if(buzzer.playerName === playerName && buzzer.teamKey === teamKey){
      status.textContent = "أنت ضغطت أولًا ✓";
    }else{
      status.textContent =
        "ضغط أولًا: " + buzzer.playerName + " — " + buzzer.teamName;
    }

    if(remainingMs <= 0){
      clearInterval(reopenTimer);
      openBuzzerNow();
    }
  };

  updateTimer();
  reopenTimer = setInterval(updateTimer, 150);
}

window.pressBuzzer = async function(){
  if(!buzzerEnabled) return;

  buzzerEnabled = false;
  document.getElementById("buzzerBtn").disabled = true;

  const now = Date.now();

  const result = await runTransaction(
    ref(db, "sessions/" + sessionId + "/buzzer"),
    current => {
      const stillLocked =
        current?.locked === true &&
        Number(current?.lockedUntil || 0) > now;

      if(stillLocked) return;

      return {
        locked: true,
        playerName,
        teamKey,
        teamName,
        pressedAt: now,
        lockedUntil: now + (buzzerLockSeconds * 1000)
      };
    }
  );

  if(!result.committed){
    document.getElementById("status").textContent = "سبقك لاعب آخر";
  }
};


onValue(ref(db, "sessions/" + sessionId + "/state"), snap => {
  const state = snap.val() || {};
  roomBuzzerEnabled = state.buzzerEnabled !== false;
  buzzerLockSeconds = Math.min(
    10,
    Math.max(1, Number(state.buzzerLockSeconds) || 3)
  );

  if(document.getElementById("gameArea").style.display === "block"){
    if(roomBuzzerEnabled){
      openBuzzerNow();
    }else{
      buzzerEnabled = false;
      document.getElementById("buzzerBtn").disabled = true;
      document.getElementById("status").textContent = "الجرس مغلق من الإعدادات";
      document.getElementById("countdown").style.display = "none";
    }
  }
});

onValue(ref(db, "sessions/" + sessionId + "/buzzer"), snap => {
  const buzzer = snap.val();
  const gameVisible =
    document.getElementById("gameArea").style.display === "block";

  if(!gameVisible) return;

  const activeLock =
    buzzer?.locked === true &&
    Number(buzzer?.lockedUntil || 0) > Date.now();

  if(activeLock){
    showThreeSecondLock(buzzer);
  }else{
    openBuzzerNow();
  }
});
</script>
</body>
</html>
