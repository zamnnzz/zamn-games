function renderBoard(){
    const saved = roundHistory[idx] || {};

    // 🔥 فتح الجرس مع بداية الجولة
    buzzHandled = false;

    db.ref("games/" + session + "/status").set({
        locked: !!(saved.completed || saved.turn?.claimed)
    });

    // 🔥 تنظيف الإضاءة
    document.querySelectorAll(".side").forEach(el=>{
        el.style.boxShadow = "none";
    });

    // 🔥 تصفير الأخطاء
    syncTurn(saved);

    // 🔥 تصفير نقاط الجولة
    rPts = saved.points || 0;
    document.getElementById('rDisp').innerText = rPts;

    // 🔥 حذف اللاعبين السابقين من الجرس
    db.ref("games/" + session + "/buzzers").set(null);

    // 🔥 تفريغ الشبكة
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    // 🔥 إنشاء الإجابات
    currentQuestion().a.forEach((item, i) => {

        const slot = document.createElement('div');
        slot.className = 'answer-slot' + (saved.completed || saved.revealed?.[i] ? ' open' : '');

        slot.innerHTML = `
        <div class="card-flip">
            <div class="card-face face-front">
                <div class="num-circle">${i+1}</div>
            </div>
            <div class="card-face face-back">
                <span>${item.t}</span>
                <div class="points-box">${item.p}</div>
            </div>
        </div>`;

        slot.onclick = async function(){
            if (!roundHistory[idx]?.turn?.claimed || roundHistory[idx]?.completed || this.classList.contains('open') || this.dataset.pending) return;
            this.dataset.pending = 'true';
            try {
                const result = await FeudRules.answer(db,session,idx,i,currentQuestion().a);
                if (result.committed) document.getElementById('sndDing').play().catch(()=>{});
            } catch (e) {
                document.getElementById('turnNotice').textContent = 'تعذر حفظ الإجابة، حاول مرة ثانية';
            } finally { delete this.dataset.pending; }
        };

        grid.appendChild(slot);
    });
    document.getElementById('qArea').innerText = saved.completed || saved.show ? currentQuestion().q : '';
}

        function reveal() {
            document.getElementById('qArea').innerText = currentQuestion().q;
            roundHistory[idx] = {...roundHistory[idx],show:true};
            db.ref('games/' + session + '/rounds/' + idx + '/show').set(true);
        }

async function errorX() {
    try {
        const result = await FeudRules.error(db,session,idx);
        if (result.committed) flashError();
    } catch (e) { document.getElementById('turnNotice').textContent = 'تعذر حفظ الخطأ، حاول مرة ثانية'; }
}
function syncTurn(saved) {
    const turn = saved.turn || {firstTeam:null,activeTeam:null,strikes:{1:0,2:0},stealMode:false,claimed:false};
    firstTeam = turn.firstTeam;
    activeTeam = turn.activeTeam;
    strikes = turn.strikes || {1:0,2:0};
    stealMode = !!turn.stealMode;
    updateStrikes();
    highlightTeam(saved.completed ? saved.awardedTeam : activeTeam);
    const winner = teams[saved.awardedTeam]?.n;
    document.getElementById('turnNotice').textContent = saved.completed ? 'نقاط الجولة لـ ' + winner :
        !turn.claimed ? 'بانتظار الجرس' :
        stealMode ? 'محاولة سرقة · ' + teams[activeTeam].n : 'الدور · ' + teams[activeTeam].n;
}

function sameTeamName(first, second) {
    const normalize = name => name.normalize('NFKC').trim().replace(/\s+/g, ' ').toLocaleLowerCase('ar');
    return normalize(first) === normalize(second);
}

function selectQuestionCount(count) {
    document.getElementById('questionCount').value = count;
    updateCountButtons();
}
function updateCountButtons() {
    const count = Number(document.getElementById('questionCount').value);
    document.querySelectorAll('.count-options button').forEach((button,i) => {
        const selected = [5,10,15,20][i] === count;
        button.classList.toggle('selected',selected);
        button.setAttribute('aria-pressed',String(selected));
    });
}
async function prepareGame() {
    const button = document.getElementById('prepareButton');
    const error = document.getElementById('welcomeError');
    button.disabled = true;
    error.textContent = '';
    currentScreen = 'preparing';
    const names = {
        c1: document.getElementById('welcomeTeam1').value.trim(),
        c2: document.getElementById('welcomeTeam2').value.trim()
    };
    if (!names.c1 || !names.c2) {
        error.textContent = 'اكتب اسم الفريقين قبل البداية';
        document.getElementById(!names.c1 ? 'welcomeTeam1' : 'welcomeTeam2').focus();
        currentScreen = 'menu';
        button.disabled = false;
        return;
    }
    if (sameTeamName(names.c1, names.c2)) {
        error.textContent = 'اسم الفريقين لازم يكون مختلف';
        document.getElementById('welcomeTeam2').focus();
        currentScreen = 'menu';
        button.disabled = false;
        return;
    }
    const count = Number(document.getElementById('questionCount').value);
    if (!Number.isInteger(count) || count < 1 || count > game.length) {
        error.textContent = 'اختر عدد أسئلة من ١ إلى ' + game.length;
        document.getElementById('questionCount').focus();
        currentScreen = 'menu';
        button.disabled = false;
        return;
    }
    const selectedQuestions = FeudRules.pickQuestions(game.length,count);
    try {
        await db.ref('games/' + session).update({
            settings: { teamNames: names, questionCount:count },
            questionOrder:selectedQuestions,
            lifecycle: { started:false, time:Date.now() },
            state: { index:0, show:false },
            scores: { c1:0, c2:0 },
            round: { points:0 },
            status: { locked:true },
            buzzers:null,
            rounds:null,
            players:null,
            control:null
        });
        teams[1] = {n:names.c1,s:0};
        teams[2] = {n:names.c2,s:0};
        questionOrder = selectedQuestions;
        resultsShown = false;
        idx = 0;
        currentScreen = 'waiting';
        document.getElementById('menuScreen').style.display = 'none';
        openSettings();
    } catch (e) {
        currentScreen = 'menu';
        error.textContent = 'تعذر تجهيز اللعبة، حاول مرة ثانية';
    } finally {
        button.disabled = false;
    }
}

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.ref('games/' + session + '/rounds').on('value', snap => {
    roundHistory = snap.val() || {};
    if (currentScreen !== 'game') return;
    const saved = roundHistory[idx] || {};
    rPts = saved.points || 0;
    syncTurn(saved);
    document.getElementById('rDisp').innerText = rPts;
    document.querySelectorAll('.answer-slot').forEach((slot,i) => {
        slot.classList.toggle('open', !!(saved.completed || saved.revealed?.[i]));
    });
    document.getElementById('qArea').innerText = saved.completed || saved.show ? currentQuestion().q : '';
});
db.ref('games/' + session + '/questionOrder').on('value', snap => {
    const saved = snap.val();
    if (Array.isArray(saved) && saved.length && saved.every(id => Number.isInteger(id) && id >= 0 && id < game.length) && new Set(saved).size === saved.length) {
        questionOrder = saved;
    } else { questionOrder = game.map((_,i) => i); }
    if (currentScreen === 'game') renderBoard();
});
db.ref('games/' + session + '/lifecycle').on('value', snap => {
    const data = snap.val();
    if (data?.started && currentScreen === 'waiting') startGame();
    if (data?.finished && currentScreen === 'game' && !resultsShown) {
        resultsShown = true;
        FeudRules.showResults(db,session).catch(()=>{resultsShown=false});
    }
    if (!data?.finished) resultsShown = false;
});
db.ref("games/" + session + "/state").on("value", snap => {

    const data = snap.val();
    if (!data) return;

    idx = data.index || 0;
    if (currentScreen !== "game") return;

    // 🔥 مهم جداً
    renderBoard(); 

    if (data.show) {
        reveal();
    }

    update();
});
// 👇 هنا تحطه بالضبط
db.ref("games/" + session + "/control").on("value", snap => {

    const data = snap.val();
    if (!data) return;

    if (currentScreen !== "game") return;
    console.log("CONTROL:", data);

    // 🟢 كشف السؤال
    if (data.action === "showQuestion") {
        reveal();
    }

    // 🟢 كشف إجابة
    else if (data.action === "revealAnswer") {
        const slots = document.querySelectorAll(".answer-slot");
        const slot = slots[data.index];
        if (slot && !slot.classList.contains("open")) {
            slot.click();

});

let buzzHandled = false;
let buzzLocked = true;

// 🟢 نراقب حالة الجرس

    const data = snap.val();
    buzzLocked = data?.locked !== false;
});

// 🟢 استقبال الجرس
db.ref("games/" + session + "/buzzers").on("value", snap => {

    const data = snap.val();
    if (!data) return;

    // 🔥 تجاهل لو الجرس مقفل
    if (buzzLocked) return;

    // 🔥 مهم: رجعناه هنا
    if (buzzHandled) return;

    const players = Object.values(data);
    if (players.length === 0) return;

    const fastest = players.sort((a,b) => a.time - b.time)[0];
    if (!fastest) return;

    buzzHandled = true;

    document.getElementById('sndDing').play().catch(()=>{});

    showFastest(fastest);
});

function showFastest(player) {

    // 🧹 حذف أي نافذة قديمة
    const old = document.getElementById("fastestBox");
    if (old) old.remove();

    // 📦 إنشاء الصندوق
    const box = document.createElement("div");
    box.id = "fastestBox";

    box.style.position = "fixed";
    box.style.top = "50%";
    box.style.left = "50%";
    box.style.transform = "translate(-50%, -50%)";
    box.style.background = "#000";
    box.style.color = "#fff";
    box.style.border = "4px solid gold";
    box.style.padding = "25px";
    box.style.borderRadius = "20px";
    box.style.fontSize = "32px";
    box.style.zIndex = "9999";
    box.style.textAlign = "center";

    box.innerHTML = `🔥 الأسرع 🔥<br>${player.name}`;
    document.body.appendChild(box);

    FeudRules.claim(db,session,idx,player.team === 'c1' ? 1 : 2).catch(()=>{});
    db.ref('games/' + session + '/status').set({locked:true,time:Date.now()});
    // ⏱️ إخفاء الصندوق بعد ثانيتين
    setTimeout(() => {
        box.remove();
    }, 2000);
}

function highlightTeam(team){
    document.querySelectorAll(".side").forEach(el=>{
        el.style.boxShadow = "none";
    });

    if (![1,2].includes(team)) return;
    const target = team === 1 
        ? document.querySelector(".team-right") 
        : document.querySelector(".team-left");

    target.style.boxShadow = "0 0 25px yellow";
}
function updateStrikes(){

    function renderX(count){
        let html = "";
        for(let i=0;i<3;i++){
            if(i < count){
                html += `<span style="color:red">X</span>`;
            }else{
                html += `<span style="opacity:0.2">X</span>`;
            }
        }
        return html;
    }

    document.getElementById("x1").innerHTML = renderX(strikes[1]);
    document.getElementById("x2").innerHTML = renderX(strikes[2]);
}
function copyLink(type){

    let text = "";

    if(type === "buzz"){
        text = document.getElementById("buzzLink").innerText;
    }else{
        text = document.getElementById("hostLink").innerText;
    }

    navigator.clipboard.writeText(text);

    // 🔥 إظهار الإشعار
    const toast = document.getElementById("copyToast");
    toast.style.opacity = "1";

    setTimeout(()=>{
        toast.style.opacity = "0";
    }, 1000); // 👈 ثانية واحدة
}

<script>
(function () {
    document.getElementById('questionCount').max = game.length;
    document.getElementById('bankSizeLabel').textContent = 'حتى ' + game.length + ' سؤال';
    updateCountButtons();
    const board = document.querySelector('.main-layout');
    const viewport = document.createElement('div');
    viewport.className = 'board-viewport';
    board.before(viewport);
    viewport.appendChild(board);
    function fitBoard() {
        const styles = getComputedStyle(document.body);
        const availableWidth = (window.visualViewport ? window.visualViewport.width : window.innerWidth) - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight);
        const availableHeight = (window.visualViewport ? window.visualViewport.height : window.innerHeight) - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom);
        const width = board.offsetWidth;
        const topInset = 36;
        const height = board.offsetHeight + topInset;
        const scale = Math.max(0.01, Math.min(availableWidth / width, availableHeight / height, 1.2));
        viewport.style.width = (width * scale) + 'px';
        viewport.style.height = (height * scale) + 'px';
        board.style.top = (topInset * scale) + 'px';
        board.style.transform = 'scale(' + scale + ')';
    }
    new ResizeObserver(fitBoard).observe(board);
    window.addEventListener('resize', fitBoard);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitBoard);
    fitBoard();
})();
</script>
